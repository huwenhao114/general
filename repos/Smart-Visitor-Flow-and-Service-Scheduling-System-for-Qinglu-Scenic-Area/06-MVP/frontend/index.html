<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青麓景区 · 客流与服务调度系统 MVP</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <div class="logo">🏞️ 青麓景区 · 客流与服务调度系统</div>
  <nav>
    <button class="nav-btn active" data-view="dashboard">客流看板</button>
    <button class="nav-btn" data-view="ai">AI分流</button>
    <button class="nav-btn" data-view="tasks">协同调度</button>
    <button class="nav-btn" data-view="records">调度记录</button>
  </nav>
  <div class="status" id="statusDot">
    <span class="dot"></span><span id="statusText">检测中...</span>
  </div>
</header>

<main>
  <!-- 统计卡片 -->
  <div class="stats" id="statsBar"></div>

  <!-- 客流看板 -->
  <section class="view active" id="view-dashboard">
    <div class="panel">
      <div class="panel-head"><h2>📊 六大区域实时客流</h2><span>点击区域可修改客流</span></div>
      <div class="area-grid" id="areaGrid"></div>
    </div>
  </section>

  <!-- AI分流 -->
  <section class="view" id="view-ai">
    <div class="panel">
      <div class="panel-head"><h2>🤖 AI智能分流建议</h2><button class="btn-primary" onclick="loadAI()">刷新建议</button></div>
      <div id="aiSuggestions" class="ai-list"></div>
    </div>
  </section>

  <!-- 协同调度 -->
  <section class="view" id="view-tasks">
    <div class="panel">
      <div class="panel-head">
        <h2>🔧 协同调度工单</h2>
        <button class="btn-primary" onclick="showTaskForm()">+ 新建任务</button>
      </div>
      <div id="taskForm" class="task-form" style="display:none">
        <input id="tfTitle" placeholder="任务标题">
        <input id="tfDesc" placeholder="任务描述">
        <select id="tfDept">
          <option>入口引导员</option><option>区域引导员</option>
          <option>保洁</option><option>安保</option><option>客服</option><option>设备维护</option>
        </select>
        <select id="tfPri">
          <option value="high">高</option><option value="mid" selected>中</option><option value="low">低</option>
        </select>
        <button class="btn-primary" onclick="createTask()">提交</button>
        <button class="btn-ghost" onclick="document.getElementById('taskForm').style.display='none'">取消</button>
      </div>
      <div id="taskList" class="task-list"></div>
    </div>
  </section>

  <!-- 调度记录 -->
  <section class="view" id="view-records">
    <div class="panel">
      <div class="panel-head"><h2>📋 客流变更记录</h2></div>
      <table class="record-table">
        <thead><tr><th>时间</th><th>区域</th><th>客流</th></tr></thead>
        <tbody id="recordTable"></tbody>
      </table>
    </div>
  </section>
</main>

<!-- 修改客流弹窗 -->
<div class="modal" id="flowModal" style="display:none">
  <div class="modal-box">
    <h3>修改 <span id="modalArea"></span> 客流</h3>
    <p>承载量：<span id="modalCap"></span> 人</p>
    <input type="number" id="modalFlow" placeholder="输入当前客流人数">
    <div class="modal-actions">
      <button class="btn-primary" onclick="saveFlow()">保存</button>
      <button class="btn-ghost" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
